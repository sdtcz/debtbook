<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="BashiBook is a free credit book app for small shops. Record who owes you, send WhatsApp reminders, works offline once opened." />
    <link rel="canonical" href="https://debtbook-neon.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BashiBook" />
    <meta property="og:title" content="BashiBook: free credit book app for your shop" />
    <meta property="og:description" content="Record who owes you, remind them on WhatsApp, collect your money. Your book stays on your phone and works offline once opened." />
    <meta property="og:url" content="https://debtbook-neon.vercel.app/" />
    <meta property="og:image" content="https://debtbook-neon.vercel.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="BashiBook logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BashiBook: free credit book app for your shop" />
    <meta name="twitter:description" content="Record who owes you, remind them on WhatsApp, collect your money. Works offline once opened." />
    <meta name="twitter:image" content="https://debtbook-neon.vercel.app/icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BashiBook" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>BashiBook</title>
    <style>
      /* Boot splash: paints with the HTML (before JS arrives on slow 2G/3G). Removed on mount. */
      html,body{margin:0;background:#f1f5f9}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 1.5rem/1.2 system-ui,-apple-system,Roboto,sans-serif;color:#0f766e}
      #boot i{display:block;width:120px;height:4px;border-radius:2px;background:#ccfbf1;overflow:hidden;position:relative}
      #boot i::after{content:"";position:absolute;inset:0;width:40%;background:#0f766e;border-radius:2px;animation:boot 1.1s ease-in-out infinite}
      @keyframes boot{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#boot i::after{animation:none;width:100%}}
      #app:not(:empty)~#boot{display:none}
      /* Flaky 2G: if the app has not started after 15 s (a file failed to arrive), say how to retry. */
      #boot small{font:600 1rem/1.4 system-ui,sans-serif;color:#0f766e;opacity:0;animation:bootretry 0s 15s forwards}
      @keyframes bootretry{to{opacity:1}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">BashiBook<i></i><small>Slow network? Reload the page to try again.</small></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
