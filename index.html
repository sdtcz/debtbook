    <style>
      /* Boot splash: paints with the HTML (before JS arrives on slow 2G/3G). Removed on mount. */
      html,body{margin:0;background:#fffbeb}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 1.5rem/1.2 system-ui,-apple-system,Roboto,sans-serif;color:#0f766e}
      #boot img{border-radius:16px}
      #boot i{display:block;width:120px;height:4px;border-radius:2px;background:#ccfbf1;overflow:hidden;position:relative}
      #boot i::after{content:"";position:absolute;inset:0;width:40%;background:#0f766e;border-radius:2px;animation:boot 1.1s ease-in-out infinite}
      @keyframes boot{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#boot i::after{animation:none;width:100%}}
      #app:not(:empty)~#boot{display:none}
      /* Flaky 2G: if the app has not started after 15 s (a file failed to arrive), say how to retry. */
      #boot small{font:600 1rem/1.4 system-ui,sans-serif;color:#0f766e;opacity:0;animation:bootretry 0s 15s forwards}
      @keyframes bootretry{to{opacity:1}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><img src="/icons/icon.svg" width="64" height="64" alt="" />BashiBook<i></i><small>Slow network? Reload the page to try again.</small></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
