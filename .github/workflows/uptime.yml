# Free uptime check (public repo, so Actions minutes are free). A failed run shows a red X
# in the Actions tab and GitHub notifies the account that last edited this schedule.
name: uptime
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: BashiBook and OpenBalance respond
        run: |
          set -u
          fail=0
          code() { curl -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 10 --max-time 20 "$1"; }
          expect() { c=$(code "$2"); echo "$2 -> $c (want $1)"; [ "$c" = "$1" ] || fail=1; }
          expect 200 https://bashibook.app/
          expect 200 'https://bashibook.app/?app=1'
          expect 200 https://bashibook.app/manifest.webmanifest
          expect 200 https://bashibook.app/.well-known/assetlinks.json
          expect 200 https://bashibook.app/credit-book-app
          expect 308 https://www.bashibook.app/
          expect 200 https://debtbook-neon.vercel.app/
          expect 200 https://www.openbalance.io/
          expect 308 https://openbalance.io/
          h=$(curl -s --retry 2 --retry-delay 10 --max-time 20 https://www.openbalance.io/api/health || true)
          echo "openbalance /api/health -> $h"
          echo "$h" | grep -q '"ok":true' || fail=1
          echo "$h" | grep -q '"database":true' || fail=1
          echo "$h" | grep -q '"email":"resend"' || fail=1
          exit $fail
